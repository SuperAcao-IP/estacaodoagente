<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperAção SP — Estação do Agente</title>
<meta name="description" content="Estação do Agente — Programa de Superação da Pobreza (SuperAção SP).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#003A79; --azul-escuro:#0D3B66;
  --politicas:#008BC9; --modulos:#2B8671; --bibliotecas:#E29200; --links:#9B0A51; --conclusao:#3BAE96;
  --cinza:#8E8E93; --branco:#FFFFFF;
  --pagina:#F4F6F8; --azul-claro:#E8F4F9;
  --texto:#1C2530; --suave:#4D5967; --borda:#D3DCE6;
  --rev-bg:#FFF6DC; --rev-borda:#E29200; --rev-texto:#6B4300;
  --raio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pagina);color:var(--texto);font-family:"Google Sans","Google Sans Text",Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:var(--azul)}
h1,h2,h3,h4{color:var(--azul);line-height:1.2;margin:0}
h1{font-size:28px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:500}
p{margin:0}
ul{margin:0;padding:0}
button{font:inherit}
:focus-visible{outline:3px solid #18DDF1;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{left:16px}

/* Cabeçalho */
.topbar{background:var(--azul);color:#D6E6F7;font-size:13px;text-align:center;padding:7px 16px}
.hdr{background:var(--azul-escuro);color:#fff}
.hdr-in{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{color:#fff;text-decoration:none;font-size:14px;letter-spacing:.02em;flex:1 1 auto;min-width:0}
.marca b{font-weight:700}
.hsearch{display:flex;align-items:center;background:#fff;border-radius:999px;padding:4px 6px 4px 16px;flex:0 1 320px;min-width:0;width:100%;max-width:320px}
.hsearch input{border:0;outline:0;font:inherit;font-size:14px;flex:1;min-width:0;background:transparent;color:var(--texto);padding:6px 0}
.hsearch button{border:0;background:none;cursor:pointer;color:var(--azul);padding:6px;display:grid;place-items:center}
.hsearch svg{width:18px;height:18px}

/* Layout geral */
main{min-width:0;outline:0}
.shell{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:20px 16px 36px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){
  .shell{grid-template-columns:250px minmax(0,1fr);transition:grid-template-columns .2s}
  .shell.min{grid-template-columns:64px minmax(0,1fr)}
  .side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-width:thin}
}
.side-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.side-top .t{font-size:13px;font-weight:700;color:var(--azul);letter-spacing:.03em;text-transform:uppercase}
.side-btn{border:1px solid var(--borda);background:#fff;color:var(--azul);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.side-btn svg{width:18px;height:18px}
.jbox{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:12px}
.jbox .jlist{margin-top:12px}
.jlist a .n{display:none}
.acesso a[aria-current="page"]{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75)}
.shell.min .t,.shell.min .jornada-titulo,.shell.min .vc{display:none}
.shell.min .side-top{justify-content:center}
.shell.min .jbox{padding:8px 6px}
.shell.min .jbox .jlist{margin-top:0}
.shell.min .jlist a,.shell.min .acesso a{justify-content:center;padding:10px 0}
.shell.min .jlist a .n{display:block;font-weight:700}
@media(max-width:899px){.shell.min .jbox,.shell.min .acesso{display:none}}
.backbar{margin-bottom:14px}
.backbar .btn svg{width:16px;height:16px}
.band{padding:32px 0}
.band.claro{background:var(--azul-claro)}
.band.azul{background:var(--azul);color:#fff}
.band.azul h2,.band.azul h3{color:#fff}
.inner{max-width:1280px;margin:0 auto;padding:0 16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-h .ico{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--azul);flex:0 0 auto}
.sec-h .ico svg{width:18px;height:18px}
.kicker{color:var(--suave);margin:4px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer;text-decoration:none;font-weight:500}
.btn.primary{background:var(--azul);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--azul);color:var(--azul);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag-rev{display:inline-block;font-size:11px;background:var(--rev-bg);color:var(--rev-texto);border:1px solid var(--rev-borda);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.rev{background:var(--rev-bg);border-left:4px solid var(--rev-borda);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--rev-texto);margin-top:14px}
.rev b{font-weight:700}
.vazio{color:var(--suave);font-style:italic}
.card{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px}

/* Página inicial */
.track-wrap{position:relative}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.jcard{flex:0 0 min(80%,320px);scroll-snap-align:start;border-radius:18px;min-height:200px;color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none}
@media(min-width:900px){.jcard{flex-basis:300px}}
.jcard .num{font-size:15px;opacity:.9;min-height:20px}
.jcard h3{color:#fff;font-size:24px;font-weight:700;margin-top:6px;text-transform:uppercase;line-height:1.15}
.jcard .go{align-self:flex-start;background:#fff;color:var(--azul);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;margin-top:14px}
.car-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:12px}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:0;background:#B9C8D8;cursor:pointer;padding:0}
.dot[aria-current="true"]{background:var(--azul);width:12px;height:12px}
.arr{width:38px;height:38px;border-radius:50%;border:1px solid var(--azul);background:#fff;color:var(--azul);display:grid;place-items:center;cursor:pointer}
.arr svg{width:18px;height:18px}
.hint{font-size:14px;color:var(--suave);max-width:240px}

.atalhos{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.atalhos{grid-template-columns:1fr 1fr}}
.atalho{display:flex;gap:16px;align-items:center;background:transparent;text-decoration:none;color:var(--texto);padding:12px;border-radius:14px}
.atalho:hover{background:rgba(255,255,255,.6)}
.atalho .ico-g{width:92px;height:92px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;color:#fff}
.atalho .ico-g svg{width:42px;height:42px}
.atalho h3{color:var(--azul);font-weight:700;font-size:19px;margin-bottom:4px}
.atalho p{font-size:15px;color:var(--texto)}

.tut{display:flex;gap:28px;align-items:center;flex-wrap:wrap;color:#fff}
.thumb{width:240px;height:136px;border-radius:12px;background:linear-gradient(120deg,#E8A33D,#B3335C 50%,#2E6FB4);position:relative;flex:0 0 auto;border:3px solid #fff}
.thumb::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:16px solid var(--azul);border-top:10px solid transparent;border-bottom:10px solid transparent;background:none}
.thumb span{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn-claro{background:#fff;color:var(--azul);border-color:#fff}

.temas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.temas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tema{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--politicas);border-radius:14px;padding:14px;color:var(--azul);font-weight:500;text-decoration:none;min-height:72px;min-width:0;overflow-wrap:anywhere}
.tema .dot-i{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#0080BE,#004685);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}

.lembre{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--azul-claro);border-radius:var(--raio);padding:18px 20px}
.lembre .wa{width:40px;height:40px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:0 0 auto}
.lembre .wa svg{width:22px;height:22px;fill:#fff}
.lembre .txt{flex:1 1 320px;min-width:0}
.lembre h3{color:#9A5B00;font-weight:700;margin-bottom:2px}
.lembre p{color:var(--texto)}

.ftr{background:var(--azul);color:#fff;padding:28px 16px}
.ftr-in{max-width:1280px;margin:0 auto;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:800px){.ftr-in{grid-template-columns:1.4fr 1fr}}
.ftr b{font-weight:700}
.ftr p{color:#BFD7F0;font-size:14px;margin-top:6px;max-width:560px}
.ftr a{color:#fff}
.ftr .contato{font-size:14px;line-height:1.8}

/* Etapas */
.etapa{display:grid;gap:22px}
@media(min-width:900px){.etapa{grid-template-columns:250px minmax(0,1fr);align-items:start}}
.jornada{background:transparent}
.jornada details{background:#fff;border-radius:var(--raio);border:1px solid var(--borda);padding:12px}
.jornada summary{cursor:pointer;font-weight:700;color:var(--azul)}
.jornada-titulo{font-size:13px;font-weight:700;color:var(--azul);letter-spacing:.03em;text-transform:uppercase;margin:4px 0 10px}
.jlist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.jlist a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#E4E8ED;color:#7A8592;text-decoration:none;font-size:14px;font-weight:500;position:relative}
.jlist a[aria-current="page"]{color:#fff;background:linear-gradient(100deg,#A02BAD,#18DDF1);font-weight:700}
.jlist a .vc{position:absolute;right:8px;top:-12px;background:var(--azul);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap}
.acesso{margin-top:18px;display:grid;gap:8px}
.acesso a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:500}
.acesso svg{width:18px;height:18px;flex:0 0 auto}
.banner{border-radius:var(--raio);color:#fff;padding:20px 24px;display:flex;gap:16px;align-items:center}
.banner .ico-b{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center}
.banner .ico-b svg{width:36px;height:36px}
.banner .tg{font-size:20px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.banner .st{font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.voltar{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;margin-bottom:12px}
.voltar svg{width:16px;height:16px}
.bloco{margin-top:28px}
.bloco h2{margin-bottom:12px}
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;margin-top:8px}
.rail::before{content:"";position:absolute;left:calc(100%/(var(--n,5))/2);right:calc(100%/(var(--n,5))/2);top:22px;height:2px;background:var(--azul);opacity:.35}
.passo{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:14px;position:relative;z-index:1;min-width:0}
.passo button.num{width:46px;height:46px;border-radius:50%;border:0;background:var(--azul);color:#fff;font-weight:700;font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 4px var(--pagina)}
.passo button.num.pend{background:#8E8E93}
.passo .lbl{margin-top:8px;color:var(--texto);line-height:1.3;padding:0 2px;min-width:0;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.recursos{background:var(--azul-claro);border-radius:var(--raio);padding:6px 20px}
.rec{padding:14px 0;border-bottom:2px solid var(--azul)}
.rec:last-child{border-bottom:0}
.rec h4{font-size:17px;font-weight:700}
.rec p{color:var(--suave);font-size:14px;margin-top:3px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.ponto{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--azul);padding:2px 0 2px 12px}
.ponto::before{content:"!";flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#FFD54A;color:var(--texto);display:grid;place-items:center;font-weight:700}
.prox{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.prox{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.prox .cardp{border:2px solid var(--politicas);border-radius:12px;padding:14px;background:#fff;font-size:15px}
.prox .cardp b{color:var(--azul)}
.chk{list-style:none;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.chk{grid-template-columns:1fr 1fr}}
.chk li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.chk li::before{content:"✓";flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}

/* Filtros e grades */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--azul);color:#fff}
.buscar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--borda);border-radius:999px;padding:8px 14px;max-width:520px;width:100%}
.buscar input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--texto)}
.buscar svg{width:18px;height:18px;color:var(--azul);flex:0 0 auto}
.pgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.pgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px;display:flex;flex-direction:column;gap:8px}
.pcard .tema-t{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.pcard h3{font-size:17px;color:var(--azul);font-weight:700}
.pcard p{font-size:14px;color:var(--texto);flex:1}
.pcard .rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ativo{display:inline-flex;align-items:center;gap:8px;background:var(--azul-claro);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;color:var(--azul)}
.ativo button{border:0;background:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--azul)}
.vazio-box{padding:28px;text-align:center;background:#fff;border:1px dashed var(--borda);border-radius:var(--raio);color:var(--suave)}

.mcards{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.mcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;text-align:left;cursor:pointer;padding:0;color:var(--texto)}
.mcard .faixa{height:10px;background:var(--modulos)}
.mcard.d .faixa{background:var(--politicas)}
.mcard.i .faixa{background:var(--bibliotecas)}
.mcard .corpo{padding:16px}
.mcard h3{color:var(--azul);font-weight:700;font-size:19px}
.mcard p{font-size:15px;margin-top:4px}
.mcard .meta{margin-top:10px;font-size:14px;color:var(--suave)}
.mcard .ver{margin-top:12px;color:var(--azul);font-weight:500;font-size:14px}
.box{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:18px;margin-top:14px}
.box h3{margin-bottom:8px;color:var(--azul);font-weight:700}
.box ul{padding-left:20px;display:grid;gap:4px}
.destaque{background:var(--azul-claro);border-radius:var(--raio);padding:16px 18px;margin-top:14px;font-size:15px}
.destaque b{color:var(--azul)}
.tab-wrap{overflow-x:auto;border-radius:var(--raio);background:#fff;border:1px solid var(--borda)}
table.tabela{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tabela th,.tabela td{padding:12px 12px;border-bottom:1px solid var(--borda);text-align:left;vertical-align:top}
.tabela th{background:var(--azul-claro);color:var(--azul);font-weight:700}
.tabela tr:last-child td{border-bottom:0}
.tutoriais{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(min-width:800px){.tutoriais{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vid{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden}
.vid .capa{height:150px;background:linear-gradient(120deg,#E8A33D,#B3335C 50%,#2E6FB4);position:relative}
.vid .capa::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.vid .info{padding:12px 14px}
.vid h3{font-size:16px;color:var(--azul);font-weight:700}
.vid p{font-size:13px;color:var(--suave)}
.links{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.links{grid-template-columns:1fr 1fr}}
.linkc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--borda);border-left:6px solid var(--links);border-radius:12px;padding:16px 18px}
.linkc b{color:var(--azul);font-size:16px}
.linkc small{display:block;color:var(--suave);font-size:13px;margin-top:2px}
.linkc .pend{font-size:12px;color:var(--rev-texto);background:var(--rev-bg);border:1px solid var(--rev-borda);border-radius:999px;padding:3px 10px;white-space:nowrap}
.faq{display:grid;gap:12px}
.faq section{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px 18px}
.faq h3{color:var(--azul);font-weight:700;font-size:17px;margin-bottom:8px}
.faq details{border-top:1px solid var(--borda);padding:10px 0}
.faq summary{cursor:pointer;color:var(--azul);font-weight:500}
.faq details p{margin-top:8px;color:var(--suave)}

/* Diálogos */
dialog.dlg{border:0;border-radius:18px;padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px);color:var(--texto);background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(8,24,44,.6)}
.dlg-h{background:var(--azul);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-h h2{color:#fff;font-size:21px}
.dlg-h .kick{font-size:13px;opacity:.85;margin-bottom:4px}
.x{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.x svg{width:16px;height:16px}
.dlg-b{padding:18px 20px;overflow:auto;max-height:calc(100vh - 230px)}
.dlg-f{padding:14px 20px;border-top:1px solid var(--borda);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;border:0;border-radius:10px;padding:12px;font-weight:500;color:#fff;background:var(--cinza);opacity:.5;cursor:pointer;font-size:15px}
.tab[aria-selected="true"]{opacity:1}
.tab.fazer[aria-selected="true"]{background:var(--azul)}
.tab.evitar[aria-selected="true"]{background:var(--bibliotecas);box-shadow:inset 0 0 0 3px #7A4B00}
.dlg .desc{font-size:15px;color:var(--suave);margin-bottom:12px}
.itens{list-style:none;display:grid;gap:10px}
.itens li{position:relative;padding-left:32px;font-size:15px}
.itens.fazer li::before{content:"✓";position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.itens.evitar li::before{content:"✕";position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--bibliotecas);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lembrete{margin-top:18px;background:var(--azul-claro);border-radius:12px;padding:12px 14px;font-size:15px}
.lembrete b{color:#9A5B00}
.ativo-pill{font-size:13px;color:var(--suave)}

@media (max-width:520px){
  .hsearch{max-width:none;flex:1 1 100%}
  .jcard{min-height:180px}
  .thumb{width:100%;max-width:300px}
  .dlg-b{max-height:calc(100vh - 210px)}
  .passo{font-size:12px}
  .passo button.num{width:38px;height:38px;font-size:16px}
  .rail::before{top:19px}
}
@media (prefers-reduced-motion: reduce){ .track{scroll-behavior:auto} }

  function paintPoliticas() {
    const modos = [['todos', 'Todos'], ['proteger', 'Proteger'], ['desenvolver', 'Desenvolver'], ['incluir', 'Incluir']];
    $('#pfiltros').innerHTML = modos.map(m =>
      '<button class="chip" data-mod="' + m[0] + '" aria-pressed="' + (pol.mod === m[0]) + '">' + m[1] + '</button>').join('');

      ? '<span class="ativo">Tema: ' + esc(temaNome(pol.tema)) + '<button data-clear-tema aria-label="Remover filtro de tema">' + ICON.close + '</button></span>'
      : '';
    const q = norm(pol.q.trim());
    const lista = CONTENT.policies.map((p, id) => ({ p, id })).filter(({ p }) => {
      if (pol.mod !== 'todos' && p[2] !== pol.mod) return false;
      if (pol.tema && p[1] !== pol.tema) return false;
      if (q && !norm(p[0] + ' ' + p[3] + ' ' + temaNome(p[1])).includes(q)) return false;
      return true;
    });
    $('#pcount').textContent = lista.length + (lista.length === 1 ? ' política encontrada' : ' políticas encontradas');
    $('#pgrid').innerHTML = lista.length ? lista.map(({ p, id }) =>
      '<article class="pcard"><span class="tema-t">' + esc(temaNome(p[1])) + '</span>' +

    $('#shell').classList.toggle('min', sideMin);
    const nums = { 'busca-ativa': '0', conhecendo: '1', compreendendo: '2', planejando: '3', acompanhando: '4', conclusao: '✓' };
    const nav = CONTENT.stageOrder.map(s =>
      '<li><a href="#/etapa/' + s + '" title="' + esc(siteNome[s]) + '"' + (s === stage ? ' aria-current="page"' : '') + '>' +
      (s === stage ? '<span class="vc">Você está aqui!</span>' : '') +
      '<span class="n" aria-hidden="true">' + nums[s] + '</span><span class="t">' + esc(siteNome[s]) + '</span></a></li>'
    ).join('');
    const acesso = ATALHOS_SIDE.map(a =>
      '<a href="#' + a[0] + '" title="' + esc(a[1]) + '" style="background:' + a[2] + '"' + (path === a[0] ? ' aria-current="page"' : '') + '>' +
      ICON[a[3]] + '<span class="t">' + esc(a[1]) + '</span></a>'
    ).join('');
    const lbl = sideMin ? 'Fixar menu aberto' : 'Minimizar menu';
    $('#side').innerHTML =
      '<div class="side-top"><span class="t">Menu</span>' +
      '<button class="side-btn" id="sideToggle" aria-expanded="' + !sideMin + '" aria-label="' + lbl + '" title="' + lbl + '">' +
      (sideMin ? ICON.next : ICON.back) + '</button></div>' +
      '<div class="jbox"><span class="jornada-titulo">Jornada da família</span><ul class="jlist">' + nav + '</ul></div>' +
      '<div class="acesso">' + acesso + '</div>';
  }

  /* ---------- Botão voltar ---------- */
  let navCount = 0;
  window.addEventListener('hashchange', () => { navCount++; });
  function backbar(path) {
    if (path === '/' && navCount === 0) return '';
    return '<div class="backbar"><button class="btn sm" data-back>' + ICON.back + ' Voltar</button></div>';
  }

  /* ---------- Roteador ---------- */
  const TITULOS = {
    '/': 'Início', '/politicas': 'Políticas Públicas', '/modulos': 'Módulos e incentivos', '/links': 'Links úteis',
    '/tutoriais': 'Tutoriais SIGMA', '/faq': 'Perguntas frequentes', '/biblioteca': 'Biblioteca', '/oportunidades': 'Oportunidades'
  };
  function route() {
    const raw = location.hash.replace(/^#/, '');
    const cut = raw.indexOf('?');
    const path = (cut >= 0 ? raw.slice(0, cut) : raw).replace(/\/+$/, '') || '/';
    const params = new URLSearchParams(cut >= 0 ? raw.slice(cut + 1) : '');
    let html, titulo;
    let m;
    if (path === '/') { html = viewHome(); titulo = 'Início'; }
    else if ((m = path.match(/^\/etapa\/([a-z-]+)$/)) && CONTENT.stages[m[1]]) {
      html = viewEtapa(m[1]); titulo = CONTENT.stages[m[1]].titulo;
    }
    else if (path === '/politicas') { html = viewPoliticas(params); titulo = 'Políticas Públicas'; }
    else if (path === '/modulos') { html = viewModulos(); titulo = 'Módulos e incentivos'; }
    else if (path === '/links') { html = viewLinks(); titulo = 'Links úteis'; }
    else if (path === '/tutoriais') { html = viewTutoriais(); titulo = 'Tutoriais SIGMA'; }
    else if (path === '/faq') { html = viewFaq(); titulo = 'Perguntas frequentes'; }
    else if (path === '/biblioteca') { html = viewBiblioteca(params); titulo = 'Biblioteca'; }
    else if (path === '/oportunidades') { html = viewOportunidades(); titulo = 'Oportunidades'; }
    else { html = viewNaoEncontrado(); titulo = 'Página não encontrada'; }

    main.innerHTML = backbar(path) + html;
    paintSide(path, m && CONTENT.stages[m[1]] ? m[1] : null);
    document.title = titulo + ' • SuperAção SP';
    if (path === '/') initCarousel();
    if (path === '/politicas') {
      paintPoliticas();
      const pq = $('#pq');
      if (pq) pq.addEventListener('input', () => { pol.q = pq.value; paintPoliticas(); });
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
    main.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', route);

  /* ---------- Carrossel da home ---------- */
  function initCarousel() {
    const track = $('#track');
    const cards = [...track.querySelectorAll('.jcard')];
    const dots = [...document.querySelectorAll('#dots .dot')];
    const step = () => (cards[1] ? cards[1].offsetLeft - cards[0].offsetLeft : track.clientWidth);
    const maxLeft = () => Math.max(0, track.scrollWidth - track.clientWidth);
    const update = () => {
      const atEnd = track.scrollLeft >= maxLeft() - 2;
      const idx = atEnd ? cards.length - 1 : Math.min(cards.length - 2, Math.round(track.scrollLeft / step()));
      dots.forEach((d, i) => d.setAttribute('aria-current', i === idx ? 'true' : 'false'));
      $('#prev').disabled = track.scrollLeft <= 2;
      $('#next').disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
    };
    track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
    track.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); track.scrollBy({ left: step() }); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); track.scrollBy({ left: -step() }); }
    });
    $('#next').addEventListener('click', () => track.scrollBy({ left: step() }));
    $('#prev').addEventListener('click', () => track.scrollBy({ left: -step() }));
    dots.forEach((d, i) => d.addEventListener('click', () => track.scrollTo({ left: Math.min(i * step(), maxLeft()) })));
    update();
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('#sideToggle')) {
      sideMin = !sideMin;
      try { localStorage.setItem(SIDE_KEY, sideMin ? '1' : '0'); } catch (err) {}
      const raw = location.hash.replace(/^#/, '').split('?')[0].replace(/\/+$/, '') || '/';
      const mm = raw.match(/^\/etapa\/([a-z-]+)$/);
      paintSide(raw, mm ? mm[1] : null); return;
    }
    if (t.closest('[data-back]')) {
      if (navCount > 0) history.back(); else location.hash = '#/';
      return;
    }
    const open = t.closest('[data-open]');
    if (open) { const [stg, i] = open.dataset.open.split(':'); openStep(stg, Number(i)); return; }
    const modBtn = t.closest('[data-mod-open]');
    if (modBtn) { openModulo(modBtn.dataset.modOpen); return; }
    const pBtn = t.closest('[data-policy]');
    if (pBtn) { openPolitica(Number(pBtn.dataset.policy)); return; }
    const chipMod = t.closest('[data-mod]');
    if (chipMod && chipMod.closest('#pfiltros')) { pol.mod = chipMod.dataset.mod; paintPoliticas(); return; }
    if (t.closest('[data-clear-tema]')) {
      pol.tema = ''; history.replaceState(null, '', '#/politicas' + (pol.q ? '?q=' + encodeURIComponent(pol.q) : ''));
      paintPoliticas(); return;
    }
    const tab = t.closest('[data-tab]');
    if (tab && tab.closest('#dlg-step')) { st.tab = tab.dataset.tab; renderStep(); return; }
    const nav = t.closest('[data-nav]');
    if (nav && nav.closest('#dlg-step')) {
      const n = Number(nav.dataset.nav);
      const max = POPUPS[st.stage].length - 1;
      st.idx = Math.min(max, Math.max(0, st.idx + n));
      st.tab = 'fazer';
      renderStep(); return;
    }
    if (t.closest('[data-close]')) { const d = t.closest('dialog'); if (d) d.close(); return; }
    // clique no fundo do diálogo fecha
    if (t.tagName === 'DIALOG') t.close();
  });
  // Dicas do carrossel e teclado: Enter nos cards é o link nativo.

  route();
})();
</script>
</body>
</html>
